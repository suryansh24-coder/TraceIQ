services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: traceiq-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: traceiq-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./backend:/app
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traceiq-frontend
    restart: unless-stopped
    # Note: Ports and command are intentionally omitted because the inspected
    # frontend/package.json and frontend/vite.config.js are completely empty.
    # We do not guess or invent a port.

volumes:
  qdrant_data:
